<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pony village</title>

<style>
:root{--bg:#4a8a3e;--panel:rgba(255,255,255,.88);--text:#222;--accent:#e0569a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2f5a2a;--panel:rgba(30,34,40,.9);--text:#eee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2f5a2a;--panel:rgba(30,34,40,.9);--text:#eee;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
.b{padding:10px 14px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font-size:16px}
#bt{position:absolute;top:8px;right:8px}
#pn{position:absolute;top:56px;right:8px;width:210px;padding:12px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.hide{display:none!important}
#pn input[type=text]{font-size:16px;padding:6px;border-radius:8px;border:1px solid var(--text);background:transparent;color:var(--text);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--text);margin:2px;padding:0}
#joy{position:absolute;left:16px;bottom:72px;width:110px;height:110px;border-radius:50%;background:var(--panel);opacity:.75;touch-action:none}
#kn{position:absolute;left:32px;top:32px;width:46px;height:46px;border-radius:50%;background:var(--accent);pointer-events:none}
#bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}
#ch{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:12px;border:0;background:var(--panel);color:var(--text);-webkit-user-select:text;user-select:text}
#bk,#st{position:absolute;top:8px;color:var(--text);text-decoration:none}
#bk{left:8px}
#st{left:64px;font-size:13px;padding:8px 12px;max-width:45vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ms{position:absolute;top:8px;right:64px}
#rj{border:1px solid var(--text);font-size:14px;padding:8px}
</style>

</head>
<body>
<canvas id="c"></canvas>
<a id="bk" class="b" href="/Menu/Home.html">🏠</a><div id="st" class="b">Menghubungkan…</div>
<button id="ms" class="b">🔊</button>
<button id="bt" class="b">🎨</button>
<div id="pn" class="hide">
<label>Nama<br><input type="text" id="nm" maxlength="12"></label>
<label>Kode ruang<br><input type="text" id="rm" maxlength="16"></label><button id="rj" class="b">Masuk ruang</button>
<div>Warna badan</div><div id="sb" class="sw"></div>
<div>Warna surai</div><div id="sm" class="sw"></div>
<label><input type="checkbox" id="hn"> Tanduk</label>
</div>
<div id="joy"><div id="kn"></div></div>
<div id="bar"><input id="ch" maxlength="60" placeholder="Ketik pesan…" autocomplete="off"><button id="sd" class="b">Kirim</button><button id="hr" class="b">❤️</button></div>
<script>
const $=id=>document.getElementById(id);
const cv=$("c"),cx=cv.getContext("2d");
let W=0,H=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);cx.imageSmoothingEnabled=false}
addEventListener("resize",rs);rs();
const WW=1600,WH=1200,S=2;
const BODY=["#f4a6c8","#a6d4f4","#f4e08a","#b9e6a0","#c9a6f4","#f2f2f2","#f4a77a"];
const MANE=["#7b2d8b","#2d6bd6","#e8458b","#2a2a2a","#f5c542","#1fa37a"];
const SAY=["Halo!","Cuaca cerah ya","Ayo main bareng","Aku suka bunga","Ada yang lihat kue?","Hehe","Selamat datang di kota!","Ke kolam yuk","Hai hai ✨"];
const REP=["Halo juga!","Hai! Salam kenal","Wah seru!","Hehe iya","Ayo jalan-jalan","Aku setuju","❤️"];
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const P={x:1150,y:300,rx:150,ry:90};
const onPath=(x,y)=>(y>550&&y<670)||(x>740&&x<860);
const inPond=(x,y,m=0)=>((x-P.x)/(P.rx+m))**2+((y-P.y)/(P.ry+m))**2<1;
const trees=[];
for(let i=0;i<60;i++){const x=rnd()*WW,y=40+rnd()*(WH-60);if(!onPath(x,y)&&!inPond(x,y,40))trees.push({x,y})}

// background
const bg=document.createElement("canvas");bg.width=WW;bg.height=WH;
(function(){const b=bg.getContext("2d");
b.fillStyle="#6fbf5f";b.fillRect(0,0,WW,WH);
for(let i=0;i<3500;i++){const x=(rnd()*WW|0)&~1,y=(rnd()*WH|0)&~1;b.fillStyle=rnd()<.5?"#62b052":"#7bcb69";b.fillRect(x,y,4,2);if(rnd()<.4){b.fillStyle="#58a449";b.fillRect(x+1,y-2,2,2)}}
b.fillStyle="#dcc088";b.fillRect(0,580,WW,60);b.fillRect(770,0,60,WH);
for(let i=0;i<700;i++){const x=(rnd()*WW|0)&~1,y=(rnd()*WH|0)&~1;if(!((y>=580&&y<640)||(x>=770&&x<830)))continue;b.fillStyle=rnd()<.5?"#c9ab70":"#e8d3a0";b.fillRect(x,y,2,2)}
const fc=["#fff","#ffd24a","#ff7aa8","#b48cff"];
for(let i=0;i<320;i++){const x=(rnd()*WW|0)&~1,y=(rnd()*WH|0)&~1;if(onPath(x,y)||inPond(x,y,20))continue;b.fillStyle="#3f8f35";b.fillRect(x+2,y+4,2,4);b.fillStyle=fc[i%4];b.fillRect(x+2,y,2,2);b.fillRect(x,y+2,2,2);b.fillRect(x+4,y+2,2,2);b.fillRect(x+2,y+4,2,2);b.fillStyle="#ffd24a";b.fillRect(x+2,y+2,2,2)}
b.fillStyle="#9fd3f0";b.beginPath();b.ellipse(P.x,P.y,P.rx+10,P.ry+10,0,0,7);b.fill();
b.fillStyle="#4aa3df";b.beginPath();b.ellipse(P.x,P.y,P.rx,P.ry,0,0,7);b.fill();
b.fillStyle="rgba(255,255,255,.35)";for(let i=0;i<14;i++)b.fillRect(P.x-100+i*14,P.y-34+(i%4)*18,8,2);
})();
const solid=(x,y)=>{if(x<15||x>WW-15||y<25||y>WH-10)return true;if(inPond(x,y))return true;for(const t of trees){const dx=x-t.x,dy=y-t.y;if(dx*dx+dy*dy<324)return true}return false};
const mv=(e,dx,dy)=>{if(!solid(e.x+dx,e.y))e.x+=dx;if(!solid(e.x,e.y+dy))e.y+=dy};
const pick=a=>a[Math.random()*a.length|0];
function mk(n,x,y){while(solid(x,y)){x=300+Math.random()*1000;y=300+Math.random()*600}
return{name:n,x,y,body:pick(BODY),mane:pick(MANE),horn:Math.random()<.4,dir:1,t:0,say:"",sayT:0,moving:false,tx:x,ty:y,wait:Math.random()*3,ns:3+Math.random()*8}}
const me=mk("Poni",760+Math.random()*80,590+Math.random()*50);
const npcs=["Bintang","Pelangi","Melati","Awan","Cokelat","Senja"].map(n=>mk(n,500+Math.random()*600,420+Math.random()*400));
try{const s=JSON.parse(localStorage.getItem("poni")||"null");if(s){me.name=s.n||me.name;me.body=s.b||me.body;me.mane=s.m||me.mane;me.horn=!!s.h}}catch(e){}
const save=()=>{try{localStorage.setItem("poni",JSON.stringify({n:me.name,b:me.body,m:me.mane,h:me.horn}))}catch(e){}};

// input
const keys={};let jx=0,jy=0;
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;keys[e.key.toLowerCase()]=1});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=0});
const joy=$("joy"),kn=$("kn");let jid=null;
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy),R=45;if(d>R){dx*=R/d;dy*=R/d}jx=dx/R;jy=dy/R;kn.style.transform="translate("+dx+"px,"+dy+"px)"}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};
joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;jx=jy=0;kn.style.transform=""};

// chat
function send(){const t=$("ch").value.trim();if(!t)return;$("ch").value="";me.say=t;me.sayT=5;if(sendCh)try{sendCh(t)}catch(e){}
if(Object.keys(peers).length)return;
let n=null,bd=300;for(const e of npcs){const d=Math.hypot(e.x-me.x,e.y-me.y);if(d<bd){bd=d;n=e}}
if(n)setTimeout(()=>{n.say=pick(REP);n.sayT=4},1200)}
$("sd").onclick=send;$("ch").onkeydown=e=>{if(e.key==="Enter")send()};
$("hr").onclick=()=>{me.say="❤️";me.sayT=2.5;if(sendCh)try{sendCh("❤️")}catch(e){}};

// panel
$("bt").onclick=()=>$("pn").classList.toggle("hide");
function sw(id,arr,key){arr.forEach(c=>{const d=document.createElement("button");d.style.background=c;d.onclick=()=>{me[key]=c;save()};$(id).appendChild(d)})}
sw("sb",BODY,"body");sw("sm",MANE,"mane");
$("nm").value=me.name;$("nm").oninput=e=>{me.name=e.target.value.trim()||"Poni";save()};
$("hn").checked=me.horn;$("hn").onchange=e=>{me.horn=e.target.checked;save()};

// update
function npc(e,dt){
e.sayT-=dt;e.ns-=dt;if(e.ns<0){e.say=pick(SAY);e.sayT=4;e.ns=10+Math.random()*12}
if(e.wait>0){e.wait-=dt;e.moving=false;return}
const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
if(d<5){e.wait=1+Math.random()*3;e.tx=e.x+(Math.random()-.5)*400;e.ty=e.y+(Math.random()-.5)*300;e.moving=false;return}
const ox=e.x,oy=e.y;mv(e,dx/d*45*dt,dy/d*45*dt);e.moving=true;e.t+=dt;if(Math.abs(dx)>1)e.dir=dx>0?1:-1;
if(Math.abs(e.x-ox)+Math.abs(e.y-oy)<.01){e.tx=e.x;e.ty=e.y}}
function update(dt){
let vx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0)+jx,vy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0)+jy;
const m=Math.hypot(vx,vy);me.moving=m>.12;me.sayT-=dt;
if(me.moving){const k=Math.min(1,m);mv(me,vx/m*k*95*dt,vy/m*k*95*dt);if(Math.abs(vx)>.1)me.dir=vx>0?1:-1;me.t+=dt}
const now=performance.now();
for(const id in peers){const q=peers[id];q.x+=(q.tx-q.x)*Math.min(1,dt*10);q.y+=(q.ty-q.y)*Math.min(1,dt*10);q.sayT-=dt;if(q.moving)q.t+=dt;if(now-q.seen>8000){delete peers[id];setSt()}}
if(!Object.keys(peers).length)npcs.forEach(e=>npc(e,dt))}

// draw
let cax=0,cay=0;
const OUT="#3a2c3f";
function sh(c,f){const n=parseInt(c.slice(1),16),g=s=>Math.max(0,Math.min(255,Math.round(((n>>s)&255)*f)));return"rgb("+g(16)+","+g(8)+","+g(0)+")"}
function dp(L){
for(const p of L)if(p[5]!==0){cx.fillStyle=OUT;cx.fillRect((p[1]-1)*S,(p[2]-1)*S,(p[3]+2)*S,(p[4]+2)*S)}
for(const p of L){cx.fillStyle=p[0];cx.fillRect(p[1]*S,p[2]*S,p[3]*S,p[4]*S)}}
function pony(e){
const x=Math.round(e.x-cax),y=Math.round(e.y-cay),b=e.body,m=e.mane,w=e.moving,t=e.t*10;
const l=i=>w&&Math.sin(t+i*1.6)>0?2:0,sw=w?Math.round(Math.sin(t*.8)*1.5):0,bd=sh(b,.8),hl=sh(b,1.12),hf="#4a3f4f";
cx.save();cx.translate(x,y);
cx.fillStyle="rgba(0,0,0,.2)";cx.beginPath();cx.ellipse(2,0,30,6,0,0,7);cx.fill();
cx.scale(e.dir,1);
if(w)cx.translate(0,-Math.round(Math.abs(Math.sin(t))*2));
const L=[
[m,-18,-17,5,9],[m,-20+sw*2,-10,4,8],[sh(m,1.3),-16,-16,1,7,0],
[bd,-9,-8,3,8-l(1)],[hf,-9,-2-l(1),3,2,0],[bd,3,-8,3,8-l(3)],[hf,3,-2-l(3),3,2,0],
[b,-14,-18,22,10],[sh(b,.88),-14,-10,22,2,0],[hl,-12,-17,18,1,0],[m,-9,-16,1,3,0],[m,-10,-15,3,1,0],
[b,-13,-8,3,8-l(0)],[hf,-13,-2-l(0),3,2,0],[b,6,-8,3,8-l(2)],[hf,6,-2-l(2),3,2,0],
[b,3,-25,6,9],
[m,1,-30,5,16],[sh(m,1.3),3,-29,1,12,0],[m,0,-22,2,7],
[bd,12,-34,3,5],
[b,6,-30,12,10],[b,16,-26,5,6],[b,8,-35,3,6],["#f3b4c6",9,-34,1,3,0]];
if(e.horn)L.push(["#fff1b8",12,-38,3,9],["#fff1b8",13,-41,1,3],["#f1c453",12,-35,3,1,0],["#f1c453",12,-32,3,1,0]);
L.push([m,5,-32,13,3],[m,15,-29,3,5],["#fff",11,-26,4,4,0],[sh(m,.9),12,-26,3,4,0],["#111",13,-25,2,3,0],["#fff",13,-26,1,1,0],["rgba(0,0,0,.4)",19,-23,1,1,0],[sh(b,.6),17,-21,3,1,0],["rgba(255,90,130,.4)",10,-22,3,2,0]);
dp(L);cx.restore()}
function tree(t){
const x=Math.round(t.x-cax),y=Math.round(t.y-cay);
if(x<-60||x>W+60||y<-10||y>H+110)return;
cx.save();cx.translate(x,y);
dp([["#7a5230",-3,-16,6,16],["#7a5230",-5,-2,2,2],["#7a5230",3,-2,2,2],["#5e3e22",-1,-14,1,9,0],["#92683b",1,-15,1,7,0],
["#2a6e2e",-15,-26,30,12],["#2f7d32",-13,-34,26,12],["#3e9a42",-10,-40,20,10],["#4fb352",-6,-45,12,8],
["#6bcb6a",-6,-43,4,2,0],["#5cbf5c",-11,-37,4,2,0],["#5cbf5c",3,-35,4,2,0],["#215c25",-13,-17,4,2,0],["#215c25",3,-16,5,2,0],["#215c25",9,-22,3,2,0],["#215c25",-4,-27,4,2,0]]);
cx.restore()}
function wrap(t,mw){const w=t.split(" "),L=[];let c="";for(const s of w){const n=c?c+" "+s:s;if(cx.measureText(n).width>mw&&c){L.push(c);c=s}else c=n}L.push(c);return L}
function label(e){
const x=e.x-cax,y=e.y-cay-(e.horn?94:78);
cx.textAlign="center";cx.font="bold 12px system-ui,sans-serif";cx.lineWidth=3;cx.strokeStyle="rgba(0,0,0,.6)";cx.fillStyle="#fff";
cx.strokeText(e.name,x,y);cx.fillText(e.name,x,y);
if(e.sayT>0){cx.font="12px system-ui,sans-serif";const L=wrap(e.say,170);
const bw=Math.max(...L.map(s=>cx.measureText(s).width))+16,bh=L.length*15+8,bx=x-bw/2,by=y-18-bh;
cx.beginPath();if(cx.roundRect)cx.roundRect(bx,by,bw,bh,8);else cx.rect(bx,by,bw,bh);
cx.fillStyle="#fff";cx.fill();cx.lineWidth=1.5;cx.strokeStyle="#333";cx.stroke();
cx.fillStyle="#222";L.forEach((s,i)=>cx.fillText(s,x,by+15+i*15))}}
function draw(){
cx.fillStyle="#4a8a3e";cx.fillRect(0,0,W,H);
cax=W>=WW?(WW-W)/2:Math.max(0,Math.min(WW-W,me.x-W/2));
cay=H>=WH?(WH-H)/2:Math.max(0,Math.min(WH-H,me.y-H/2));
cx.drawImage(bg,-cax,-cay);
const all=[me,...others()];
all.map(e=>({y:e.y,f:()=>pony(e)})).concat(trees.map(t=>({y:t.y,f:()=>tree(t)}))).sort((a,b)=>a.y-b.y).forEach(o=>o.f());
all.forEach(label)}

// multiplayer (WebRTC peer-to-peer via Trystero, tanpa server sendiri)
const peers={};let room=null,sendSt=null,sendCh=null,roomName="umum",netOK=false,ct=0,nt=0,lm=false;
const HEX=/^#[0-9a-f]{6}$/i,num=(v,m)=>Math.max(0,Math.min(m,+v||0));
const others=()=>{const v=Object.values(peers);return v.length?v:npcs};
function setSt(){const n=Object.keys(peers).length;$("st").textContent=netOK?"Ruang "+roomName+": "+(n+1)+" pemain"+(n?"":" + NPC"):"Offline (main sendiri)"}
function pack(){return{x:Math.round(me.x),y:Math.round(me.y),d:me.dir,mv:me.moving?1:0,n:me.name,b:me.body,m:me.mane,h:me.horn?1:0}}
function onState(d,id){
if(!d||typeof d!=="object")return;
let q=peers[id];
if(!q){q=peers[id]={x:num(d.x,WW),y:num(d.y,WH),dir:1,t:0,say:"",sayT:0,moving:false,name:"Poni",body:BODY[0],mane:MANE[0],horn:false,tx:0,ty:0,seen:0};setSt()}
q.tx=num(d.x,WW);q.ty=num(d.y,WH);q.dir=d.d<0?-1:1;q.moving=!!d.mv;
q.name=String(d.n||"Poni").slice(0,12);if(HEX.test(d.b))q.body=d.b;if(HEX.test(d.m))q.mane=d.m;q.horn=!!d.h;q.seen=performance.now()}
async function connect(name){
const tk=++ct;
roomName=String(name||"umum").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,16)||"umum";
$("rm").value=roomName;try{history.replaceState(null,"","#"+roomName)}catch(e){}
if(room){try{room.leave()}catch(e){}}
room=null;sendSt=sendCh=null;netOK=false;for(const k in peers)delete peers[k];
$("st").textContent="Menghubungkan…";
try{
const {joinRoom}=await import("https://cdn.jsdelivr.net/npm/trystero@0.21/+esm");
if(tk!==ct)return;
room=joinRoom({appId:"ponyndo-poni-kota-v1"},roomName);
const [ss,gs]=room.makeAction("st"),[sc,gc]=room.makeAction("ch");
sendSt=ss;sendCh=sc;gs(onState);
gc((t,id)=>{const q=peers[id];if(q&&typeof t==="string"){q.say=t.slice(0,60);q.sayT=5}});
room.onPeerJoin(id=>{try{sendSt(pack(),id)}catch(e){}});
room.onPeerLeave(id=>{delete peers[id];setSt()});
netOK=true}catch(e){netOK=false;room=null;sendSt=sendCh=null}
setSt()}
function netTick(dt){nt-=dt;if(sendSt&&(nt<=0||me.moving!==lm)){try{sendSt(pack())}catch(e){}nt=me.moving?.1:1;lm=me.moving}}
$("rj").onclick=()=>connect($("rm").value);
addEventListener("pagehide",()=>{try{room&&room.leave()}catch(e){}});

// musik tenang (dibuat langsung dengan WebAudio, tanpa file)
let ac=null,mg=null,dl=null,mOn=false,nxt=0,stp=0,tmr=null,lastN=76,mp="on";
try{mp=localStorage.getItem("poni-m")||"on"}catch(e){}
const PENT=[72,74,76,79,81,84,86,88,91,93],CH=[[48,55,59,64],[45,52,55,60],[41,48,52,57],[43,50,59,64]],TG=[[72,76,79,84],[72,76,81,84],[72,76,81,84],[74,79,76,86]];
const fr=m=>440*Math.pow(2,(m-69)/12),EB=.42;
function mkAudio(){
ac=new(window.AudioContext||window.webkitAudioContext)();
mg=ac.createGain();mg.gain.value=0;mg.connect(ac.destination);
const dy=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter();
dy.delayTime.value=.45;fb.gain.value=.38;lp.type="lowpass";lp.frequency.value=1800;
dl=ac.createGain();dl.gain.value=.5;
dl.connect(dy);dy.connect(lp);lp.connect(fb);fb.connect(dy);lp.connect(mg)}
function note(f,t,dur,type,v,at){
const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
o.connect(g);g.connect(mg);g.connect(dl);o.start(t);o.stop(t+dur+.1)}
function sched(){
if(nxt<ac.currentTime-1)nxt=ac.currentTime+.1;
while(nxt<ac.currentTime+.4){
const s=stp%64,ci=s>>4,si=s&15;
if(si===0){CH[ci].forEach(m=>{note(fr(m),nxt,7.5,"sine",.06,1.6);note(fr(m)*1.004,nxt,7.5,"sine",.035,1.9)});note(fr(CH[ci][0]-12),nxt,6,"sine",.09,.6)}
if(Math.random()<(si%4===0?.85:.45)){
let m;if(si%4===0)m=pick(TG[ci]);else{let i=PENT.indexOf(lastN)+pick([-2,-1,-1,1,1,2]);i=Math.max(0,Math.min(PENT.length-1,i));m=PENT[i]}
lastN=m;note(fr(m),nxt,2.2,"triangle",.08,.02)}
nxt+=EB;stp++}}
function startM(){if(!ac)mkAudio();ac.resume();mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setTargetAtTime(.5,ac.currentTime,.5);nxt=ac.currentTime+.1;clearInterval(tmr);tmr=setInterval(()=>{if(ac.state==="running")sched()},120);mOn=true;$("ms").textContent="🔊"}
function stopM(){clearInterval(tmr);if(mg)mg.gain.setTargetAtTime(0,ac.currentTime,.3);mOn=false;$("ms").textContent="🔇"}
$("ms").textContent=mp==="off"?"🔇":"🔊";
$("ms").onclick=()=>{if(mOn){stopM();mp="off"}else{startM();mp="on"}try{localStorage.setItem("poni-m",mp)}catch(e){}};
const first=e=>{if(e.target.closest&&e.target.closest("#ms"))return;removeEventListener("pointerdown",first);removeEventListener("keydown",first);if(mp!=="off"&&!mOn)startM()};
addEventListener("pointerdown",first);addEventListener("keydown",first);
document.addEventListener("visibilitychange",()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(mOn)ac.resume()});
connect(decodeURIComponent(location.hash.slice(1))||"umum");
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);netTick(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
